# Corre las pruebas en Windows, Mac y Linux cada vez que se sube un cambio o se propone uno (pull request).
# Si alguna falla, GitHub lo marca en rojo y avisa por correo.
name: Pruebas

on:
  push:
    branches: [main]
  pull_request:

# un cambio nuevo cancela las pruebas viejas de la misma rama: no se acumulan si alguna se demora
concurrency:
  group: pruebas-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pruebas:
    name: ${{ matrix.sistema }} · Node ${{ matrix.node }}
    runs-on: ${{ matrix.sistema }}
    timeout-minutes: 15   # si algo se cuelga, falla en minutos y no en horas
    strategy:
      fail-fast: false
      matrix:
        sistema: [windows-latest, macos-latest, ubuntu-latest]
        node: [24]
        include:
          # la versión más vieja que se acepta (package.json: engines)
          - sistema: ubuntu-latest
            node: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Pruebas
        working-directory: celular-dev
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee ../prueba.log
      - name: Resumen (visible en la página de la ejecución)
        if: always()
        shell: bash
        run: |
          {
            echo "### ${{ matrix.sistema }} · Node ${{ matrix.node }}"
            echo '```'
            grep -E '^(ℹ|✖)|not ok|Error|timed out|cancelled' prueba.log | head -60 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # solo si algo falló: las pruebas que fallan también como anotaciones (se ven sin iniciar sesión)
          if [ "${{ job.status }}" = "failure" ]; then
            grep -E '^✖|AssertionError|^ +(expected|actual):|^ +[+-] ' prueba.log | sed 's/%/%25/g' | head -20 | while IFS= read -r linea; do echo "::error title=${{ matrix.sistema }} Node ${{ matrix.node }}::${linea}"; done || true
          fi
