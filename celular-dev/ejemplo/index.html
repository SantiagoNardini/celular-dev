<html lang="en">
<head>

<title>celular-dev demo</title>
<link rel="stylesheet" href="estilos.css">

<body>
<main>
  <p class="etiqueta">celular-dev · example site</p>

  <p class="nota">Both buttons fail on purpose: celular-dev shows each error in the panel, explained in plain language.</p>
